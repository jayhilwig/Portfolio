<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=yes, width=device-width">
	<title>Method Cards</title>

	<!-- ionic css -->
	<link href="lib/css/ionic.css" rel="stylesheet">
	<link rel="stylesheet" href="lib/css/prototype-fonts.css">

	<!-- app's css -->
	<link href="css/app.css" rel="stylesheet">

<style>
.learnColor {
  background-color:#00a0b0;
}
.lookColor {
  background:#cc333f;
}
.askColor {
  background-color:#eb6841;
}
.tryColor {
  background:#edc951;
}
</style>


	<!-- ionic/angularjs scripts 
	<script src="lib/js/ionic.bundle.js"></script>

	<!-- cordova script (this will be a 404 during development)
	<script src="cordova.js"></script>

    <!-- app's script 
    <script src="js/app.js"></script>
    <script src="js/services.js"></script>
    <script src="js/controllers.js"></script>-->

    <style>
    .row {padding:0px;}
    .row {height:25vh}
    </style>

</head>

<body no-scroll>

	<ion-view title="'IDEO Method Cards'">
	<ion-content has-header="false" has-tabs="false">

	<div id="container">


		<a href="http://www.ideo.com/">
			<div class="row">
				<div class="smallCol learnColor"></div>
				<div class="bigCol centerImg">
					<IMG SRC="img/ideo.svg" WIDTH="95%"></IMG>
				</div>
				<div class="smallCol learnColor"></div>
			</div>
		</a>

		<a href="main.html#/tab/card0">
			<div class="row">
				<div class="smallCol lookColor"></div>
				<div class="bigCol">
					<H1>Cards</H1>
				</div>
				<div class="smallCol lookColor"></div>
			</div>
		</a>

		<a href="main.html#/tab/group">
			<div class="row">
				<div class="smallCol askColor"></div>
				<div class="bigCol">
					<H1>Groups</H1>
				</div>
				<div class="smallCol askColor"></div>
			</div>
		</a>

		<a href="#">
			<div class="row">
				<div class="smallCol tryColor"></div>
				<div class="bigCol">
					<H1>Wildcard!</H1>
				</div>
				<div class="smallCol tryColor"></div>
			</div>
		</a>

	</div>



</ion-content>
</ion-view>





</body>
</html>
